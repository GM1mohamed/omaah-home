<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإنجازات - معهد جيل الأمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="logo"><i class="fas fa-medal"></i></div>
            <div class="institute-name">
                <h1>إنجازات المعهد</h1>
                <p>أبرز إنجازات طلابنا</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- حاوية الإنجازات -->
        <div id="achievementsList" class="achievements-grid">
            <div class="loading"><div class="spinner"></div><p>جاري التحميل...</p></div>
        </div>
    </main>

    <!-- نافذة التفاصيل المنبثقة -->
    <div id="achievementModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color: var(--primary-dark);"></h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalImages" style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px;"></div>
            <p id="modalDescription" style="color: var(--text); line-height: 1.6; margin-bottom: 15px;"></p>
            <div id="modalTags" style="display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 15px;">
                <span class="achievement-tag" style="background: #f0f0f0; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; color: var(--text);"></span>
            </div>
            <div class="achievement-stats" style="border-top: none; padding-top: 0; margin-bottom: 15px;">
                <span><i class="fas fa-heart" style="color: #e91e63;"></i> <span id="modalLikes">0</span> إعجاب</span>
                <span><i class="fas fa-comment" style="color: var(--primary);"></i> <span id="modalCommentsCount">0</span> تعليق</span>
            </div>
            <div id="modalComments" style="border-top: 1px solid #eee; padding-top: 15px; margin-bottom: 15px; max-height: 150px; overflow-y: auto;"></div>
            <div class="comment-form" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="commentName" class="form-input" placeholder="اسمك" style="padding: 10px;">
                <textarea id="commentText" class="form-textarea" placeholder="اكتب تعليقك..." rows="3" style="padding: 10px;"></textarea>
                <button id="submitCommentBtn" class="btn btn-primary">نشر التعليق</button>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item">
            <i class="fas fa-home nav-icon"></i>
            <span class="nav-label">الرئيسية</span>
        </a>
        <a href="game.html" class="nav-item">
            <i class="fas fa-gamepad nav-icon"></i>
            <span class="nav-label">التحدي</span>
        </a>
        <a href="competitions.html" class="nav-item">
            <i class="fas fa-trophy nav-icon"></i>
            <span class="nav-label">المسابقات</span>
        </a>
        <a href="achievements.html" class="nav-item active">
            <i class="fas fa-medal nav-icon"></i>
            <span class="nav-label">الإنجازات</span>
        </a>
        <a href="student.html" class="nav-item">
            <i class="fas fa-user nav-icon"></i>
            <span class="nav-label">ملفي</span>
        </a>
    </nav>

    <script type="module">
        import { db, collection, getDocs, updateDoc, doc, arrayUnion } from '../firebase-config.js';

        let achievements = [];
        let currentAchievement = null;

        function timeOf(value) {
            if (!value) return 0;
            if (typeof value.toMillis === 'function') return value.toMillis();
            const t = new Date(value).getTime();
            return isNaN(t) ? 0 : t;
        }

        // تحميل الإنجازات
        async function loadAchievements() {
            const container = document.getElementById('achievementsList');
            try {
                const snapshot = await getDocs(collection(db, "achievements"));
                achievements = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                achievements.sort((a, b) => (timeOf(b.createdAt) || 0) - (timeOf(a.createdAt) || 0));
                
                if (achievements.length === 0) {
                    container.innerHTML = '<div class="card" style="text-align: center;">لا توجد إنجازات حالياً</div>';
                    return;
                }
                
                container.innerHTML = '';
                achievements.forEach(achievement => {
                    const imageHtml = achievement.images && achievement.images[0] 
                        ? `<img src="${achievement.images[0].url}" class="achievement-image" alt="${achievement.title}">`
                        : `<div class="achievement-image" style="background: linear-gradient(135deg, var(--primary-light), var(--primary)); display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-trophy" style="color: white; font-size: 3rem;"></i>
                           </div>`;

                    container.innerHTML += `
                        <div class="achievement-card" onclick="openAchievement('${achievement.id}')">
                            ${imageHtml}
                            <div class="achievement-content">
                                <h4 class="achievement-title">${achievement.title}</h4>
                                <p class="achievement-desc">${achievement.description?.substring(0, 100) || ''}...</p>
                                <div class="achievement-stats">
                                    <span><i class="fas fa-heart"></i> ${achievement.likes || 0}</span>
                                    <span><i class="fas fa-comment"></i> ${achievement.comments?.length || 0}</span>
                                    <span><i class="fas fa-images"></i> ${achievement.images?.length || 0}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="card" style="text-align: center;">حدث خطأ في تحميل الإنجازات</div>';
            }
        }

        // فتح نافذة التفاصيل
        window.openAchievement = (id) => {
            currentAchievement = achievements.find(a => a.id === id);
            if (!currentAchievement) return;
            
            document.getElementById('modalTitle').textContent = currentAchievement.title;
            document.getElementById('modalDescription').textContent = currentAchievement.description || '';
            document.getElementById('modalLikes').textContent = currentAchievement.likes || 0;
            document.getElementById('modalCommentsCount').textContent = currentAchievement.comments?.length || 0;
            
            // الصور
            const imagesContainer = document.getElementById('modalImages');
            imagesContainer.innerHTML = '';
            if (currentAchievement.images) {
                currentAchievement.images.forEach(img => {
                    imagesContainer.innerHTML += `<img src="${img.url}" style="width: 150px; height: 100px; object-fit: cover; border-radius: 8px; cursor: pointer;" onclick="window.open('${img.url}', '_blank')">`;
                });
            }
            
            // الوسوم
            const tagsContainer = document.getElementById('modalTags');
            tagsContainer.innerHTML = '';
            if (currentAchievement.tags) {
                currentAchievement.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="achievement-tag">${tag}</span>`;
                });
            }
            
            // التعليقات
            const commentsContainer = document.getElementById('modalComments');
            commentsContainer.innerHTML = '';
            if (currentAchievement.comments && currentAchievement.comments.length > 0) {
                currentAchievement.comments.forEach(comment => {
                    commentsContainer.innerHTML += `
                        <div style="background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                            <div style="font-weight: 600; color: var(--primary-dark);">${comment.user}</div>
                            <div style="color: var(--text); font-size: 0.9rem;">${comment.comment}</div>
                            <div style="font-size: 0.75rem; color: #666;">${new Date(comment.date).toLocaleDateString('ar-EG')}</div>
                        </div>
                    `;
                });
            } else {
                commentsContainer.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">لا توجد تعليقات</p>';
            }
            
            document.getElementById('achievementModal').style.display = 'flex';
        };

        // إغلاق النافذة
        window.closeModal = () => {
            document.getElementById('achievementModal').style.display = 'none';
        };
        document.getElementById('achievementModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // إضافة تعليق
        document.getElementById('submitCommentBtn').addEventListener('click', async () => {
            const userName = document.getElementById('commentName').value.trim();
            const commentText = document.getElementById('commentText').value.trim();
            
            if (!userName || !commentText) {
                alert('الرجاء إدخال اسمك والتعليق');
                return;
            }
            
            if (!currentAchievement) return;
            
            const newComment = {
                user: userName,
                comment: commentText,
                date: new Date().toISOString()
            };
            
            const achievementRef = doc(db, "achievements", currentAchievement.id);
            await updateDoc(achievementRef, {
                comments: arrayUnion(newComment)
            });
            
            document.getElementById('commentName').value = '';
            document.getElementById('commentText').value = '';
            
            await loadAchievements();
            openAchievement(currentAchievement.id);
        });

        // تفعيل الرابط النشط في الشريط السفلي
        document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (window.location.pathname.includes(href)) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });

        loadAchievements();
    </script>
</body>
</html>
